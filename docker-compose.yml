services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradieos
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tradieos']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    restart: unless-stopped
    volumes:
      - tradieos_postgres_data:/var/lib/postgresql/data

volumes:
  tradieos_postgres_data:
